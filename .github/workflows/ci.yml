name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 mpv pytest

      - name: 문법 검사
        run: python -m compileall -q main.py app tools tests

      - name: 모델 테스트 (ffmpeg / mpv 불필요)
        run: pytest -q tests
