name: Release (exe 빌드)

# v0.2.0 처럼 v 로 시작하는 태그를 push 하면 exe 를 빌드해서 Release 에 올린다.
#   git tag v0.2.0 && git push origin v0.2.0
# Actions 탭에서 "Run workflow" 로 수동 실행하면 Release 없이 artifact 만 만든다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ffmpeg 다운로드 (gyan.dev essentials)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Copy-Item (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe)[0].FullName bin\
          Copy-Item (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffprobe.exe)[0].FullName bin\
          & bin\ffmpeg.exe -version | Select-Object -First 1

      - name: libmpv 다운로드 (러너에 7z 있음)
        run: python tools/get_libmpv.py

      - name: 아이콘 생성
        run: |
          pip install pillow
          python tools/make_icon.py

      - name: PyInstaller 빌드
        shell: pwsh
        run: .\build.ps1

      - name: zip 묶기
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver -notlike "v*") { $ver = "dev-" + "${{ github.sha }}".Substring(0, 7) }
          Compress-Archive -Path dist\ClipSlicer -DestinationPath "ClipSlicer-$ver-win64.zip"
          "ZIP=ClipSlicer-$ver-win64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: ClipSlicer-win64
          path: ${{ env.ZIP }}

      - name: GitHub Release 생성
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
